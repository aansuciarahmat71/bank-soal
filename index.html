(function () {

    if (t && t.nodeType === 3) t = t.parentNode;
    while (t && t.nodeType === 1) {
      var tag = t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return true;
      t = t.parentNode;

  }
  function blok(e) { if (!editable(e.target)) e.preventDefault(); }
  ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut'].forEach(function (n) {
    document.addEventListener(n, blok, true);
  });
  document.addEventListener('keydown', function (e) {
    var k = String(e.key || '').toLowerCase();

      (ctrl && (k === 's' || k === 'u' || k === 'p')) ||

    if (dilarang) { e.preventDefault(); e.stopPropagation(); return; }
    if (ctrl && (k === 'a' || k === 'c' || k === 'x') && !editable(e.target)) e.preventDefault();
  }, true);
  window.addEventListener('beforeprint', function () { document.documentElement.style.display = 'none'; });

function callServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    // setTimeout(0) meniru sifat asynchronous dari panggilan server asli
    setTimeout(() => {
      try {
        if (fnName === "getSoalData") {
          const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
          resolve(raw || "[]");
        } else if (fnName === "saveSoalData") {
          localStorage.setItem(LOCAL_STORAGE_KEY, args[0]);
          resolve({ ok: true });
        } else {
          reject(new Error("Fungsi server tidak dikenal: " + fnName));
        }
      } catch (err) {
        reject(err instanceof Error ? err : new Error(String(err)));
      }
    }, 0);
  });
}

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Gagal membaca file gambar"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("File bukan gambar yang valid"));
      img.onload = () => {
        let { width, height } = img;
        if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
          const scale = MAX_IMAGE_DIMENSION / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "var(--card)";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", IMAGE_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function useSoalStore() {
  const [soal, setSoal] = useState([]);
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [saving, setSaving] = useState(false);
  const [syncError, setSyncError] = useState("");
  const [syncInfo, setSyncInfo] = useState("");
  const soalRef = useRef(soal);
  soalRef.current = soal;
  const sudahSinkron = useRef(false);

  const fetchFromServer = useCallback(async () => {
    setStatus("loading");
    try {
      const raw = await callServer("getSoalData");
      const data = JSON.parse(raw || "[]");
      setSoal(Array.isArray(data) ? data : []);
      setStatus("ready");
      setSyncError("");
    } catch (e) {
      setStatus("error");
      setSyncError("Gagal memuat data dari server: " + (e && e.message ? e.message : e));
    }
  }, []);

  useEffect(() => {
    fetchFromServer();
  }, [fetchFromServer]);

  const persist = useCallback((next) => {
    setSoal(next);
    setSaving(true);
    callServer("saveSoalData", JSON.stringify(next))
      .then(() => {
        setSyncError("");
      })
      .catch((e) => {
        setSyncError("Gagal menyimpan ke server: " + (e && e.message ? e.message : e));
      })
      .finally(() => setSaving(false));
  }, []);

  const syncRemote = useCallback(async () => {
    if (!REMOTE_SOAL_URL) return;
    setSyncInfo("Memeriksa pembaruan soal...");
    try {
      const sep = REMOTE_SOAL_URL.indexOf("?") >= 0 ? "&" : "?";
      const res = await fetch(REMOTE_SOAL_URL + sep + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const parsed = await res.json();
      const items = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.soal) ? parsed.soal : null;
      const valid =
        items &&
        items.length > 0 &&
        items.every((it) => it && typeof it === "object" && it.id && typeof it.materi === "string" && typeof it.soalText === "string");
      if (!valid) throw new Error("format file soal tidak valid atau kosong");

      let prevIds = [];
      try { prevIds = JSON.parse(localStorage.getItem(REMOTE_IDS_KEY) || "[]"); } catch (e) {}
      const remoteIds = new Set(items.map((it) => it.id));
      const map = new Map(soalRef.current.map((x) => [x.id, x]));

      let dihapus = 0;
      let diperbarui = 0;
      prevIds.forEach((id) => {
        if (!remoteIds.has(id) && map.has(id)) { map.delete(id); dihapus++; }
      });
      const baru = [];
      items.forEach((it) => {
        const lama = map.get(it.id);
        if (!lama) { baru.push(it); return; }
        const gabung = { ...lama, ...it };
        if (JSON.stringify(gabung) !== JSON.stringify(lama)) { diperbarui++; map.set(it.id, gabung); }
      });

      try { localStorage.setItem(REMOTE_IDS_KEY, JSON.stringify(Array.from(remoteIds))); } catch (e) {}
      if (baru.length || diperbarui || dihapus) {
        persist([...baru, ...Array.from(map.values())]);
        const bagian = [];
        if (baru.length) bagian.push(baru.length + " soal baru");
        if (diperbarui) bagian.push(diperbarui + " soal diperbarui");
        if (dihapus) bagian.push(dihapus + " soal dihapus");
        setSyncInfo("Pembaruan soal: " + bagian.join(", ") + ".");
      } else {
        setSyncInfo("Soal sudah yang terbaru (" + items.length + " soal dari sumber).");
      }
    } catch (e) {
      setSyncInfo("Tidak bisa memeriksa pembaruan soal (" + (e && e.message ? e.message : e) + "). Memakai soal yang tersimpan di perangkat ini.");
    }
  }, [persist]);

  useEffect(() => {
    if (status === "ready" && !sudahSinkron.current) {
      sudahSinkron.current = true;
      syncRemote();
    }
  }, [status, syncRemote]);

  const addSoal = useCallback(
    (item) => {
      const next = [
        { ...item, id: generateId(), createdAt: Date.now() },
        ...soal,
      ];
      persist(next);
    },
    [soal, persist]
  );

  const updateSoal = useCallback(
    (id, updates) => {
      const next = soal.map((s) => (s.id === id ? { ...s, ...updates } : s));
      persist(next);
    },
    [soal, persist]
  );

  const deleteSoal = useCallback(
    (id) => {
      const next = soal.filter((s) => s.id !== id);
      persist(next);
    },
    [soal, persist]
  );

  const mergeImportSoal = useCallback(
    (items) => {
      const map = new Map(soal.map((s) => [s.id, s]));
      items.forEach((item) => {
        if (item && item.id && map.has(item.id)) {
          map.set(item.id, { ...map.get(item.id), ...item, id: item.id });
        } else {
          const id = item && item.id ? item.id : generateId();
          map.set(id, { ...item, id, createdAt: item.createdAt || Date.now() });
        }
      });
      const next = Array.from(map.values());
      persist(next);
      return next.length;
    },
    [soal, persist]
  );

  const replaceAllSoal = useCallback(
    (items) => {
      const next = items.map((item) => ({
        ...item,
        id: item && item.id ? item.id : generateId(),
        createdAt: (item && item.createdAt) || Date.now(),
      }));
      persist(next);
      return next.length;
    },
    [persist]
  );

  return {
    soal,
    status,
    saving,
    syncError,
    retry: fetchFromServer,
    syncInfo,
    syncRemote,
    addSoal,
    updateSoal,
    deleteSoal,
    mergeImportSoal,
    replaceAllSoal,
  };
}

function parseMath(str) {
  str = String(str || "");
  let i = 0;
  const n = str.length;

  function readGroup() {
    i++;
    let depth = 1;
    const start = i;
    while (i < n && depth > 0) {
      if (str[i] === "(") depth++;
      else if (str[i] === ")") {
        depth--;
        if (depth === 0) break;
      }
      i++;
    }
    const inner = str.slice(start, i);
    i++;
    return inner;
  }

  function readSimpleToken() {
    const start = i;
    if (i < n && (str[i] === "+" || str[i] === "-")) i++;
    while (i < n && /[a-zA-Z0-9.]/.test(str[i])) i++;
    if (i === start) i++;
    return str.slice(start, i);
  }

  function splitTopLevelComma(s) {
    let depth = 0;
    let start = 0;
    const parts = [];
    for (let k = 0; k < s.length; k++) {
      if (s[k] === "(") depth++;
      else if (s[k] === ")") depth--;
      else if (s[k] === "," && depth === 0) {
        parts.push(s.slice(start, k));
        start = k + 1;
      }
    }
    parts.push(s.slice(start));
    return parts;
  }

  const nodes = [];
  let buffer = "";
  const flush = () => {
    if (buffer) {
      nodes.push({ t: "text", text: buffer });
      buffer = "";
    }
  };

  while (i < n) {
    if (str[i] === "^") {
      flush();
      i++;
      const inner = str[i] === "(" ? readGroup() : readSimpleToken();
      nodes.push({ t: "sup", children: parseMath(inner) });
      continue;
    }
    if (str[i] === "_") {
      flush();
      i++;
      const inner = str[i] === "(" ? readGroup() : readSimpleToken();
      nodes.push({ t: "sub", children: parseMath(inner) });
      continue;
    }
    if (str.slice(i, i + 5) === "sqrt(") {
      flush();
      i += 4;
      const inner = readGroup();
      nodes.push({ t: "sqrt", children: parseMath(inner) });
      continue;
    }
    if (str.slice(i, i + 5) === "frac(") {
      flush();
      i += 4;
      const inner = readGroup();
      const parts = splitTopLevelComma(inner);
      nodes.push({ t: "frac", num: parseMath(parts[0] || ""), den: parseMath(parts[1] || "") });
      continue;
    }
    buffer += str[i];
    i++;
  }
  flush();
  return nodes;
}

function MathNodes({ nodes }) {
  return nodes.map((node, idx) => {
    if (node.t === "text") return <React.Fragment key={idx}>{node.text}</React.Fragment>;
    if (node.t === "sup")
      return (
        <sup key={idx} style={{ fontSize: "0.75em" }}>
          <MathNodes nodes={node.children} />
        </sup>
      );
    if (node.t === "sub")
      return (
        <sub key={idx} style={{ fontSize: "0.75em" }}>
          <MathNodes nodes={node.children} />
        </sub>
      );
    if (node.t === "sqrt")
      return (
        <span key={idx} style={{ display: "inline-flex", alignItems: "flex-start" }}>
          <span style={{ fontSize: "1.1em", lineHeight: 1 }}>√</span>
          <span style={{ borderTop: "1.5px solid currentColor", paddingLeft: 2, paddingTop: 1 }}>
            <MathNodes nodes={node.children} />
          </span>
        </span>
      );
    if (node.t === "frac")
      return (
        <span
          key={idx}
          style={{
            display: "inline-flex",
            flexDirection: "column",
            alignItems: "center",
            verticalAlign: "middle",
            margin: "0 2px",
            fontSize: "0.92em",
            lineHeight: 1.15,
          }}
        >
          <span style={{ padding: "0 3px" }}>
            <MathNodes nodes={node.num} />
          </span>
          <span style={{ borderTop: "1.5px solid currentColor", width: "100%" }} />
          <span style={{ padding: "0 3px" }}>
            <MathNodes nodes={node.den} />
          </span>
        </span>
      );
    return null;
  });
}

// Memecah teks menjadi potongan biasa dan potongan LaTeX: $...$, $$...$$, \(...\), \[...\]
function splitLatex(str) {
  str = String(str || "");
  const n = str.length;
  const segs = [];
  let buf = "";
  let i = 0;
  const push = () => {
    if (buf) {
      segs.push({ math: false, text: buf });
      buf = "";
    }
  };
  while (i < n) {
    if (str.startsWith("$$", i)) {
      const end = str.indexOf("$$", i + 2);
      if (end > -1) {
        push();
        segs.push({ math: true, display: true, text: str.slice(i + 2, end) });
        i = end + 2;
        continue;
      }
    }
    if (str[i] === "\\" && str[i + 1] === "$") {
      buf += "$";
      i += 2;
      continue;
    }
    if (str[i] === "$") {
      let end = i + 1;
      while (end < n && !(str[end] === "$" && str[end - 1] !== "\\")) end++;
      if (end < n && end > i + 1) {
        push();
        segs.push({ math: true, display: false, text: str.slice(i + 1, end) });
        i = end + 1;
        continue;
      }
    }
    if (str.startsWith("\\(", i)) {
      const end = str.indexOf("\\)", i + 2);
      if (end > -1) {
        push();
        segs.push({ math: true, display: false, text: str.slice(i + 2, end) });
        i = end + 2;
        continue;
      }
    }
    if (str.startsWith("\\[", i)) {
      const end = str.indexOf("\\]", i + 2);
      if (end > -1) {
        push();
        segs.push({ math: true, display: true, text: str.slice(i + 2, end) });
        i = end + 2;
        continue;
      }
    }
    buf += str[i];
    i++;
  }
  push();
  return segs;
}

function LatexSpan({ tex, display }) {
  const html = useMemo(() => {
    if (!window.katex) return null;
    try {
      return window.katex.renderToString(tex, {
        displayMode: !!display,
        throwOnError: false,
        strict: "ignore",
      });
    } catch (e) {
      return null;
    }
  }, [tex, display]);
  const Tag = display ? "div" : "span";
  if (html === null) {
    const d = display ? "$$" : "$";
    return <Tag>{d + tex + d}</Tag>;
  }
  return <Tag dangerouslySetInnerHTML={{ __html: html }} />;
}

function MathText({ text }) {
  const segs = useMemo(() => splitLatex(text || ""), [text]);
  return (
    <>
      {segs.map((sg, idx) =>
        sg.math ? (
          <LatexSpan key={idx} tex={sg.text} display={sg.display} />
        ) : (
          <MathNodes key={idx} nodes={parseMath(sg.text)} />
        )
      )}
    </>
  );
}

function containsMathSyntax(text) {
  return /\^|_|sqrt\(|frac\(|\$|\\[a-zA-Z]+/.test(String(text || ""));
}

  const t = TINGKAT[tingkat] || TINGKAT.mudah;

}

function emptySoalForm() {
  return {
    materi: "",
    submateri: "",
    tingkat: "mudah",
    jenisSoal: "esai",
    soalText: "",
    soalImage: null,
    opsi: opsiKosong(),
    kunciJawaban: "",
    pembahasanType: "teks",
    pembahasanText: "",
    pembahasanImage: null,
  };
}

function SoalModal({ mode, initialData, onClose, onSave, materiList, submateriByMateri }) {
  const [form, setForm] = useState(
    initialData
      ? {
          ...emptySoalForm(),
          ...initialData,
          opsi:
            Array.isArray(initialData.opsi) && initialData.opsi.length > 0
              ? initialData.opsi
              : opsiKosong(),
        }
      : emptySoalForm()
  );
  const [errMsg, setErrMsg] = useState("");
  const [imgLoading, setImgLoading] = useState(false);
  const [soalImgLoading, setSoalImgLoading] = useState(false);
  const fileInputRef = useRef(null);
  const soalFileInputRef = useRef(null);

  const setField = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));

  const submateriSaran = useMemo(() => {
    const materiTrim = form.materi.trim();
    const dariData = (submateriByMateri && submateriByMateri[materiTrim]) || [];
    const dariSaran = SUBMATERI_SARAN[materiTrim] || [];
    return Array.from(new Set([...dariSaran, ...dariData])).sort();
  }, [submateriByMateri, form.materi]);

  const setOpsiTeks = (huruf, teks) => {
    setForm((prev) => ({
      ...prev,
      opsi: prev.opsi.map((o) => (o.huruf === huruf ? { ...o, teks } : o)),
    }));
  };

  const tambahOpsi = () => {
    setForm((prev) => {
      if (prev.opsi.length >= OPSI_HURUF.length) return prev;
      const huruf = OPSI_HURUF[prev.opsi.length];
      return { ...prev, opsi: [...prev.opsi, { huruf, teks: "" }] };
    });
  };

  const hapusOpsi = (huruf) => {
    setForm((prev) => {
      if (prev.opsi.length <= 2) return prev;
      const opsiBaru = prev.opsi.filter((o) => o.huruf !== huruf);
      return {
        ...prev,
        opsi: opsiBaru,
        kunciJawaban: prev.kunciJawaban === huruf ? "" : prev.kunciJawaban,
      };
    });
  };

  const handleImageUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setErrMsg("File yang dipilih bukan gambar.");
      return;
    }
    setImgLoading(true);
    setErrMsg("");
    try {
      const dataUrl = await compressImageFile(file);
      setField("pembahasanImage", dataUrl);
    } catch (err) {
      setErrMsg("Gagal memproses gambar. Coba gambar lain.");
    } finally {
      setImgLoading(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const handleSoalImageUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setErrMsg("File yang dipilih bukan gambar.");
      return;
    }
    setSoalImgLoading(true);
    setErrMsg("");
    try {
      const dataUrl = await compressImageFile(file);
      setField("soalImage", dataUrl);
    } catch (err) {
      setErrMsg("Gagal memproses gambar. Coba gambar lain.");
    } finally {
      setSoalImgLoading(false);
      if (soalFileInputRef.current) soalFileInputRef.current.value = "";
    }
  };

  const handleSave = () => {
    if (!form.materi.trim()) {
      setErrMsg("Nama materi belum diisi.");
      return;
    }
    if (!form.soalText.trim()) {
      setErrMsg("Teks soal belum diisi.");
      return;
    }
    if (form.pembahasanType === "gambar" && !form.pembahasanImage) {
      setErrMsg("Silakan unggah gambar pembahasan, atau ganti ke mode teks.");
      return;
    }

    let opsiBersih = [];
    if (form.jenisSoal === "pg") {
      opsiBersih = form.opsi
        .map((o) => ({ huruf: o.huruf, teks: o.teks.trim() }))
        .filter((o) => o.teks !== "");
      if (opsiBersih.length < 2) {
        setErrMsg("Isi minimal 2 opsi jawaban untuk soal pilihan ganda.");
        return;
      }
      if (!form.kunciJawaban || !opsiBersih.some((o) => o.huruf === form.kunciJawaban)) {
        setErrMsg("Pilih kunci jawaban yang benar untuk soal pilihan ganda.");
        return;
      }
    }

    onSave({
      materi: form.materi.trim(),
      submateri: form.submateri.trim(),
      tingkat: form.tingkat,
      jenisSoal: form.jenisSoal,
      soalText: form.soalText.trim(),
      soalImage: form.soalImage || null,
      opsi: form.jenisSoal === "pg" ? opsiBersih : [],
      kunciJawaban: form.jenisSoal === "pg" ? form.kunciJawaban : "",
      pembahasanType: form.pembahasanType,
      pembahasanText: form.pembahasanType === "teks" ? form.pembahasanText.trim() : "",
      pembahasanImage: form.pembahasanType === "gambar" ? form.pembahasanImage : null,
    });
    onClose();
  };

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(20,26,33,0.55)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 50,
        padding: 16,
      }}
      onClick={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div
        style={{
          background: "var(--card)",
          borderRadius: 8,
          width: "100%",
          maxWidth: 640,
          maxHeight: "90dvh",
          overflowY: "auto",
          border: "1px solid var(--raise3)",
          boxShadow: "0 20px 50px rgba(20,30,45,0.25)",
        }}
      >
        <div
          style={{
            padding: "18px 22px",
            borderBottom: "1px solid var(--raise2)",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
          }}
        >
          <h2
            style={{
              margin: 0,
              fontFamily: "Georgia, 'Iowan Old Style', serif",
              fontSize: 20,
              color: "var(--blue2)",
            }}
          >
            {mode === "edit" ? "Edit Soal" : "Tambah Soal"}
          </h2>
          <button
            onClick={onClose}
            aria-label="Tutup"
            style={{
              border: "none",
              background: "transparent",
              fontSize: 20,
              cursor: "pointer",
              color: "var(--t3b)",
              lineHeight: 1,
            }}
          >
            ×
          </button>
        </div>

        <div style={{ padding: "20px 22px", display: "flex", flexDirection: "column", gap: 16 }}>
          <div>
            <label style={labelStyle}>Materi</label>
            <input
              list="materi-suggestions"
              value={form.materi}
              onChange={(e) => setField("materi", e.target.value)}
              placeholder="mis. Kinematika Gerak Lurus"
              style={inputStyle}
            />
            <datalist id="materi-suggestions">
              {Array.from(new Set([...MATERI_SARAN, ...materiList])).map((m) => (
                <option key={m} value={m} />
              ))}
            </datalist>
          </div>

          <div>
            <label style={labelStyle}>Submateri (opsional)</label>
            <input
              list="submateri-suggestions"
              value={form.submateri}
              onChange={(e) => setField("submateri", e.target.value)}
              placeholder="mis. GLB, GLBB, atau Gerak Vertikal"
              style={inputStyle}
            />
            <datalist id="submateri-suggestions">
              {submateriSaran.map((sm) => (
                <option key={sm} value={sm} />
              ))}
            </datalist>
            <div style={{ fontSize: 11.5, color: "var(--t4)", marginTop: 6 }}>
              Gunakan submateri untuk memecah materi menjadi topik yang lebih spesifik, mis. materi "Kinematika Gerak Lurus" → submateri "GLB" / "GLBB".
            </div>
          </div>

          <div>
            <label style={labelStyle}>Tingkat kesulitan</label>
            <div style={{ display: "flex", gap: 8 }}>
              {Object.keys(TINGKAT).map((key) => (
                <button
                  key={key}
                  onClick={() => setField("tingkat", key)}
                  style={{
                    flex: 1,
                    padding: "8px 10px",
                    borderRadius: 5,
                    border:
                      form.tingkat === key
                        ? `2px solid ${TINGKAT[key].color}`
                        : "1px solid var(--line)",
                    background: form.tingkat === key ? TINGKAT[key].bg : "var(--card)",
                    color: form.tingkat === key ? TINGKAT[key].color : "var(--t3)",
                    fontWeight: form.tingkat === key ? 700 : 500,
                    cursor: "pointer",
                    fontSize: 13,
                    fontFamily: "inherit",
                  }}
                >
                  {TINGKAT[key].label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label style={labelStyle}>Jenis soal</label>
            <div style={{ display: "flex", gap: 8 }}>
              {Object.keys(JENIS_SOAL).map((key) => (
                <button
                  key={key}
                  onClick={() => setField("jenisSoal", key)}
                  style={{
                    flex: 1,
                    padding: "8px 10px",
                    borderRadius: 5,
                    border: form.jenisSoal === key ? "2px solid var(--blue)" : "1px solid var(--line)",
                    background: form.jenisSoal === key ? "var(--sel)" : "var(--card)",
                    color: form.jenisSoal === key ? "var(--blue)" : "var(--t3)",
                    fontWeight: form.jenisSoal === key ? 700 : 500,
                    cursor: "pointer",
                    fontSize: 13,
                    fontFamily: "inherit",
                  }}
                >
                  {JENIS_SOAL[key].label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label style={labelStyle}>Teks soal (tempel/paste dari file Anda)</label>
            <textarea
              value={form.soalText}
              onChange={(e) => setField("soalText", e.target.value)}
              placeholder="Tempelkan teks soal di sini..."
              rows={6}
              style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit", lineHeight: 1.5 }}
            />
            <div style={{ fontSize: 11.5, color: "var(--t4)", marginTop: 6, lineHeight: 1.6 }}>
              Rumus: <code>v^2</code> = pangkat, <code>a_1</code> = indeks bawah, <code>sqrt(2gh)</code> = akar, <code>frac(m1,m2)</code> = pecahan. Gunakan kurung untuk grup lebih dari satu karakter, mis. <code>v^(2n+1)</code>.
            </div>
            {containsMathSyntax(form.soalText) && (
              <div
                style={{
                  marginTop: 8,
                  padding: "8px 10px",
                  border: "1px dashed var(--line)",
                  borderRadius: 6,
                  background: "var(--panel)",
                  fontSize: 14,
                  color: "var(--t1)",
                  whiteSpace: "pre-wrap",
                }}
              >
                <div style={{ fontSize: 11, color: "var(--t4)", marginBottom: 4 }}>Pratinjau</div>
                <MathText text={form.soalText} />
              </div>
            )}
            <div style={{ marginTop: 10 }}>
              <label style={{ ...labelStyle, marginBottom: 6 }}>Gambar soal (opsional)</label>
              <div>
                <input
                  ref={soalFileInputRef}
                  type="file"
                  accept="image/*"
                  onChange={handleSoalImageUpload}
                  style={{ fontSize: 13 }}
                />
                {soalImgLoading && (
                  <div style={{ fontSize: 12.5, color: "var(--t4)", marginTop: 6 }}>Memproses gambar...</div>
                )}
                {form.soalImage && !soalImgLoading && (
                  <div style={{ marginTop: 10 }}>
                    <img
                      src={form.soalImage}
                      alt="Pratinjau gambar soal"
                      style={{ maxWidth: "100%", maxHeight: 260, borderRadius: 6, border: "1px solid var(--line)" }}
                    />
                    <div>
                      <button
                        onClick={() => setField("soalImage", null)}
                        style={{ ...linkBtnStyle, color: "var(--red)", marginTop: 6 }}
                      >
                        Hapus gambar
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>

          {form.jenisSoal === "pg" && (
            <div>
              <label style={labelStyle}>Opsi jawaban &amp; kunci jawaban</label>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {form.opsi.map((o) => (
                  <div key={o.huruf} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <label
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 5,
                          cursor: "pointer",
                          flexShrink: 0,
                        }}
                        title="Tandai sebagai jawaban benar"
                      >
                        <input
                          type="radio"
                          name="kunciJawaban"
                          checked={form.kunciJawaban === o.huruf}
                          onChange={() => setField("kunciJawaban", o.huruf)}
                        />
                        <span
                          style={{
                            fontFamily: "'JetBrains Mono', monospace",
                            fontSize: 13,
                            fontWeight: 700,
                            color: form.kunciJawaban === o.huruf ? "var(--green)" : "var(--t3)",
                            width: 16,
                          }}
                        >
                          {o.huruf}
                        </span>
                      </label>
                      <input
                        value={o.teks}
                        onChange={(e) => setOpsiTeks(o.huruf, e.target.value)}
                        placeholder={`Teks opsi ${o.huruf}`}
                        style={{ ...inputStyle, flex: 1 }}
                      />
                      {form.opsi.length > 2 && (
                        <button
                          onClick={() => hapusOpsi(o.huruf)}
                          aria-label={`Hapus opsi ${o.huruf}`}
                          style={{ ...linkBtnStyle, color: "var(--red)" }}
                        >
                          Hapus
                        </button>
                      )}
                    </div>
                    {containsMathSyntax(o.teks) && (
                      <div style={{ fontSize: 13.5, color: "var(--t3)", paddingLeft: 24 }}>
                        <MathText text={o.teks} />
                      </div>
                    )}
                  </div>
                ))}
              </div>
              {form.opsi.length < OPSI_HURUF.length && (
                <button onClick={tambahOpsi} style={{ ...linkBtnStyle, marginTop: 6 }}>
                  + Tambah opsi
                </button>
              )}
              <div style={{ fontSize: 11.5, color: "var(--t4)", marginTop: 6 }}>
                Pilih bulatan di samping huruf opsi untuk menandai jawaban yang benar.
              </div>
            </div>
          )}

          <div>
            <label style={labelStyle}>Pembahasan</label>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button
                onClick={() => setField("pembahasanType", "teks")}
                style={{
                  flex: 1,
                  padding: "8px 10px",
                  borderRadius: 5,
                  border: form.pembahasanType === "teks" ? "2px solid var(--blue)" : "1px solid var(--line)",
                  background: form.pembahasanType === "teks" ? "var(--sel)" : "var(--card)",
                  color: form.pembahasanType === "teks" ? "var(--blue)" : "var(--t3)",
                  fontWeight: form.pembahasanType === "teks" ? 700 : 500,
                  cursor: "pointer",
                  fontSize: 13,
                  fontFamily: "inherit",
                }}
              >

              </button>
              <button
                onClick={() => setField("pembahasanType", "gambar")}
                style={{
                  flex: 1,
                  padding: "8px 10px",
                  borderRadius: 5,
                  border: form.pembahasanType === "gambar" ? "2px solid var(--blue)" : "1px solid var(--line)",
                  background: form.pembahasanType === "gambar" ? "var(--sel)" : "var(--card)",
                  color: form.pembahasanType === "gambar" ? "var(--blue)" : "var(--t3)",
                  fontWeight: form.pembahasanType === "gambar" ? 700 : 500,
                  cursor: "pointer",
                  fontSize: 13,
                  fontFamily: "inherit",

              >

              <div>

                  rows={6}
                  style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit", lineHeight: 1.5 }}

                  <div

                      marginTop: 8,
                      padding: "8px 10px",

                      borderRadius: 6,
                      background: "var(--panel)",

        </div>

        <div
          style={{
            padding: "16px 22px",
            borderTop: "1px solid var(--raise2)",
            display: "flex",
            justifyContent: "flex-end",
            gap: 10,

            {mode === "edit" ? "Simpan perubahan" : "Simpan soal"}

        </div>
      </div>
    </div>
  );
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatMenitLabel(totalDetik) {
  const totalMenit = Math.round(totalDetik / 60);
  if (totalMenit < 60) return `${totalMenit} menit`;
  const jam = Math.floor(totalMenit / 60);
  const sisaMenit = totalMenit % 60;
  return sisaMenit === 0 ? `${jam} jam` : `${jam} jam ${sisaMenit} menit`;
}

// ==== PEMBUAT FILE WORD (.docx) UNTUK LEMBAR SOAL CETAK ====
// Pustaka "docx" dimuat sekali dari CDN saat tombol "Unduh file Word" pertama
// kali diklik (sama seperti React/Babel di file ini yang juga dimuat dari CDN),
// lalu dipakai untuk merakit file .docx asli langsung di browser guru.
let _docxLibPromise = null;
function loadDocxLib() {
  if (window.docx) return Promise.resolve(window.docx);
  if (_docxLibPromise) return _docxLibPromise;
  _docxLibPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";
    script.crossOrigin = "anonymous";
    script.onload = () => {
      if (window.docx) resolve(window.docx);
      else reject(new Error("Pustaka docx gagal dimuat"));
    };
    script.onerror = () => {
      _docxLibPromise = null;
      reject(new Error("Gagal memuat pustaka pembuat Word dari internet"));
    };
    document.head.appendChild(script);
  });
  return _docxLibPromise;
}

function dataUrlToArrayBuffer(dataUrl) {
  return fetch(dataUrl).then((r) => r.arrayBuffer());
}

function getImageNaturalSize(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ width: img.naturalWidth || 400, height: img.naturalHeight || 300 });
    img.onerror = () => resolve({ width: 400, height: 300 });
    img.src = dataUrl;
  });
}

// items: array soal (materi/submateri/tingkat/kunciJawaban TIDAK ditampilkan,
// karena dokumen ini untuk dicetak & dibagikan ke siswa).
async function buildSoalWordBlob({ judul, infoLines, items }) {
  const {
    Document,
    Packer,
    Paragraph,
    TextRun,
    HeadingLevel,
    AlignmentType,
    ImageRun,
    BorderStyle,
  } = await loadDocxLib();

  const children = [];

  children.push(
    new Paragraph({
      children: [new TextRun({ text: judul || "Evaluasi Fisika", bold: true, size: 32 })],
      heading: HeadingLevel.HEADING_1,
      alignment: AlignmentType.CENTER,
      spacing: { after: 80 },
    })
  );

  (infoLines || []).forEach((line) => {
    children.push(
      new Paragraph({
        children: [new TextRun({ text: line, italics: true, size: 20, color: "555555" })],
        alignment: AlignmentType.CENTER,
        spacing: { after: 60 },
      })
    );
  });

  children.push(
    new Paragraph({
      children: [new TextRun({ text: "Nama: ......................................................        Kelas: ..................", size: 22 })],
      spacing: { before: 240, after: 60 },
    })
  );
  children.push(
    new Paragraph({
      children: [new TextRun({ text: "No. Absen: ..............", size: 22 })],
      spacing: { after: 240 },
      border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: "999999", space: 4 } },
    })
  );

  for (let i = 0; i < items.length; i++) {
    const s = items[i] || {};
    children.push(
      new Paragraph({
        children: [
          new TextRun({ text: `${i + 1}. `, bold: true, size: 24 }),
          new TextRun({ text: (s.soalText || "").trim(), size: 24 }),
        ],
        spacing: { before: 220, after: 80 },
      })
    );

    if (s.soalImage) {
      try {
        const [buf, dim] = await Promise.all([
          dataUrlToArrayBuffer(s.soalImage),
          getImageNaturalSize(s.soalImage),
        ]);
        const maxW = 420;
        const w = Math.min(maxW, dim.width || maxW);
        const h = Math.round(w * ((dim.height || 300) / (dim.width || 400)));
        children.push(
          new Paragraph({
            children: [new ImageRun({ data: buf, transformation: { width: w, height: h } })],
            spacing: { after: 120 },
          })
        );
      } catch (e) {
        // Lewati gambar yang gagal dimuat agar proses tetap lanjut
      }
    }

    if (s.jenisSoal === "pg" && Array.isArray(s.opsi)) {
      s.opsi.forEach((o) => {
        children.push(
          new Paragraph({
            children: [
              new TextRun({ text: `${o.huruf}. `, bold: true, size: 22 }),
              new TextRun({ text: o.teks || "", size: 22 }),
            ],
            indent: { left: 400 },
            spacing: { after: 40 },
          })
        );
      });
    } else {
      for (let k = 0; k < 3; k++) {
        children.push(
          new Paragraph({
            children: [new TextRun({ text: "" })],
            border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: "AAAAAA", space: 6 } },
            spacing: { after: 140 },
          })
        );
      }
    }
  }

  const doc = new Document({ sections: [{ properties: {}, children }] });
  return Packer.toBlob(doc);
}

const APPS_SCRIPT_SNIPPET = `var BASE_HEADER = ["Waktu", "Nama", "Kelas", "Pelanggaran", "Skor PG", "Benar PG", "Total PG"];
var BASE_COLS = BASE_HEADER.length;

function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);

  if (sheet.getLastRow() === 0) {
    sheet.appendRow(BASE_HEADER);
    sheet.appendRow(new Array(BASE_COLS).fill(""));
    sheet.getRange(2, BASE_COLS).setValue("Kunci Jawaban");
    sheet.appendRow(new Array(BASE_COLS).fill(""));
    sheet.getRange(3, BASE_COLS).setValue("% Benar");
  }

  var soalId = data.soalId || [];
  var soalTeks = data.soalTeks || [];
  var soalMateri = data.soalMateri || [];
  var soalSubmateri = data.soalSubmateri || [];
  var kunciBaris = data.kunciBaris || [];
  var jawaban = data.jawaban || [];

  var lastCol = Math.max(sheet.getLastColumn(), BASE_COLS);
  var headerNotes = lastCol > 0 ? sheet.getRange(1, 1, 1, lastCol).getNotes()[0] : [];

  var kolomUntukSoal = [];
  for (var i = 0; i < soalId.length; i++) {
    var idx = -1;
    for (var c = BASE_COLS; c < headerNotes.length; c++) {
      if (String(headerNotes[c]).split("||")[0] === soalId[i]) { idx = c + 1; break; }
    }
    if (idx !== -1 && (soalMateri[i] || soalSubmateri[i])) {
      // Kolom sudah ada dari sebelum fitur materi/submateri ditambahkan, atau
      // dibuat saat submateri belum terisi — lengkapi/perbarui catatannya.
      var notaLama = String(headerNotes[idx - 1] || "").split("||");
      var materiSekarang = notaLama[1] || "";
      var submateriSekarang = notaLama[2] || "";
      if (!materiSekarang || !submateriSekarang) {
        sheet.getRange(1, idx).setNote(
          soalId[i] + "||" + (soalMateri[i] || materiSekarang) + "||" + (soalSubmateri[i] || submateriSekarang)
        );
      }
    }
    if (idx === -1) {
      lastCol++;
      idx = lastCol;
      var judulSingkat = String(soalTeks[i] || "").slice(0, 40);
      var selHeader = sheet.getRange(1, idx);
      selHeader.setValue(judulSingkat);
      selHeader.setNote(soalId[i] + "||" + (soalMateri[i] || "") + "||" + (soalSubmateri[i] || ""));
      sheet.getRange(2, idx).setValue(kunciBaris[i] || "");
      if (kunciBaris[i] && kunciBaris[i] !== "ESAI") {
        var kolomHuruf = kolomKeHuruf(idx);
        sheet.getRange(3, idx).setFormula('=IFERROR(COUNTIF(' + kolomHuruf + '4:' + kolomHuruf + '9999,' + kolomHuruf + '$2)/COUNTA(' + kolomHuruf + '4:' + kolomHuruf + '9999),"")');
      } else {
        sheet.getRange(3, idx).setValue("Esai (nilai manual)");
      }
      headerNotes.push(soalId[i]);
    }
    kolomUntukSoal.push(idx);
  }

  var skorPg = (data.skorPg === undefined || data.skorPg === null) ? "" : data.skorPg;
  var rowDasar = [new Date(), data.nama, data.kelas, data.jumlahPelanggaran || 0, skorPg, data.benarPg || 0, data.totalPg || 0];
  var barisBaru = sheet.getLastRow() + 1;
  sheet.getRange(barisBaru, 1, 1, BASE_COLS).setValues([rowDasar]);
  for (var k = 0; k < kolomUntukSoal.length; k++) {
    sheet.getRange(barisBaru, kolomUntukSoal[k]).setValue(jawaban[k]);
  }

  return ContentService
    .createTextOutput(JSON.stringify({ status: "ok" }))
    .setMimeType(ContentService.MimeType.JSON);
}

function kolomKeHuruf(kolom) {
  var huruf = "";
  while (kolom > 0) {
    var sisa = (kolom - 1) % 26;
    huruf = String.fromCharCode(sisa + 65) + huruf;
    kolom = Math.floor((kolom - sisa - 1) / 26);
  }
  return huruf;
}

// ==== ANALISIS BUTIR SOAL (dijalankan manual setelah ujian selesai) ====
function onOpen() {
  SpreadsheetApp.getUi()
    .createMenu("📊 Analisis Ujian")
    .addItem("Buat / Perbarui Analisis Butir Soal", "buatAnalisisButirSoal")
    .addToUi();
}

function buatAnalisisButirSoal() {
  var ui = SpreadsheetApp.getUi();
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetData = ss.getActiveSheet();
  var lastRow = sheetData.getLastRow();
  var lastCol = sheetData.getLastColumn();

  if (lastRow < 4 || lastCol <= BASE_COLS) {
    ui.alert("Belum ada data jawaban siswa untuk dianalisis pada sheet ini.");
    return;
  }

  var headerRow = sheetData.getRange(1, 1, 1, lastCol).getValues()[0];
  var headerNotesAnalisis = sheetData.getRange(1, 1, 1, lastCol).getNotes()[0];
  var kunciRow = sheetData.getRange(2, 1, 1, lastCol).getValues()[0];
  var dataRange = sheetData.getRange(4, 1, lastRow - 3, lastCol).getValues();

  var NAMA_COL = 1; // index 0-based sesuai BASE_HEADER: Waktu,Nama,Kelas,...
  var KELAS_COL = 2;

  var itemCols = [];
  var itemNames = [];
  var itemMateri = [];
  var itemSubmateri = [];
  for (var c = BASE_COLS; c < lastCol; c++) {
    var kunci = kunciRow[c];
    if (kunci && kunci !== "ESAI" && kunci !== "Esai (nilai manual)") {
      itemCols.push(c);
      itemNames.push(headerRow[c] || ("Soal " + itemCols.length));
      var notePart = String(headerNotesAnalisis[c] || "").split("||");
      itemMateri.push(notePart.length > 1 && notePart[1] ? notePart[1] : "(materi tidak tercatat)");
      itemSubmateri.push(notePart.length > 2 && notePart[2] ? notePart[2] : "");
    }
  }

  if (itemCols.length === 0) {
    ui.alert("Tidak ditemukan soal pilihan ganda dengan kunci jawaban pada sheet ini.");
    return;
  }

  var siswa = [];
  var matriks = []; // 0/1 per siswa per soal
  var totalSkor = [];

  dataRange.forEach(function (row) {
    var nama = row[NAMA_COL];
    if (!nama) return;
    var baris01 = itemCols.map(function (c) {
      return row[c] !== "" && row[c] === kunciRow[c] ? 1 : 0;
    });
    var total = baris01.reduce(function (a, b) { return a + b; }, 0);
    siswa.push({ nama: nama, kelas: row[KELAS_COL] });
    matriks.push(baris01);
    totalSkor.push(total);
  });

  var n = siswa.length;
  var k = itemCols.length;
  if (n < 2) {
    ui.alert("Data siswa terlalu sedikit untuk dianalisis (minimal 2 siswa yang sudah mengisi nama).");
    return;
  }

  var pValues = [];
  var validitas = [];
  for (var j = 0; j < k; j++) {
    var skorItem = matriks.map(function (row) { return row[j]; });
    var p = skorItem.reduce(function (a, b) { return a + b; }, 0) / n;
    pValues.push(p);
    validitas.push(korelasiPearson_(skorItem, totalSkor));
  }

  var varTotal = variansiPopulasi_(totalSkor);
  var sumPQ = 0;
  for (var j2 = 0; j2 < k; j2++) sumPQ += pValues[j2] * (1 - pValues[j2]);
  var kr20 = varTotal > 0 && k > 1 ? (k / (k - 1)) * (1 - sumPQ / varTotal) : NaN;

  var namaSheetAnalisis = "Analisis Butir Soal";
  var sheetLama = ss.getSheetByName(namaSheetAnalisis);
  if (sheetLama) ss.deleteSheet(sheetLama);
  var out = ss.insertSheet(namaSheetAnalisis);

  var headerBaris = ["Nama", "Kelas"].concat(itemNames).concat(["Total Skor"]);
  out.appendRow(headerBaris);
  out.getRange(1, 1, 1, headerBaris.length).setFontWeight("bold").setBackground("#EAF0F6");

  for (var i = 0; i < n; i++) {
    out.appendRow([siswa[i].nama, siswa[i].kelas].concat(matriks[i]).concat([totalSkor[i]]));
  }

  var bulat3 = function (v) { return isNaN(v) ? "-" : Math.round(v * 1000) / 1000; };
  var barisRingkasan = n + 3;

  out.getRange(barisRingkasan, 1).setValue("Tingkat Kesukaran (p)").setFontWeight("bold");
  out.getRange(barisRingkasan, 3, 1, k).setValues([pValues.map(bulat3)]);

  out.getRange(barisRingkasan + 1, 1).setValue("Kategori Kesukaran").setFontWeight("bold");
  out.getRange(barisRingkasan + 1, 3, 1, k).setValues([pValues.map(kategoriKesukaran_)]);

  out.getRange(barisRingkasan + 2, 1).setValue("Validitas (r hitung)").setFontWeight("bold");
  out.getRange(barisRingkasan + 2, 3, 1, k).setValues([validitas.map(bulat3)]);

  out.getRange(barisRingkasan + 3, 1).setValue("Keterangan Validitas").setFontWeight("bold");
  out.getRange(barisRingkasan + 3, 3, 1, k).setValues([
    validitas.map(function (v) {
      if (isNaN(v)) return "Tidak dapat dihitung";
      return v >= 0.3 ? "Valid" : "Tidak Valid";
    }),
  ]);

  var barisReliabilitas = barisRingkasan + 5;
  out.getRange(barisReliabilitas, 1).setValue("Reliabilitas Tes (KR-20)").setFontWeight("bold");
  out.getRange(barisReliabilitas, 2).setValue(bulat3(kr20));
  out.getRange(barisReliabilitas + 1, 1).setValue("Kategori Reliabilitas").setFontWeight("bold");
  out.getRange(barisReliabilitas + 1, 2).setValue(kategoriReliabilitas_(kr20));
  out.getRange(barisReliabilitas + 2, 1).setValue("Jumlah Siswa Dianalisis").setFontWeight("bold");
  out.getRange(barisReliabilitas + 2, 2).setValue(n);

  // ==== RINGKASAN KETUNTASAN PER MATERI (untuk tindak lanjut/remedial) ====
  var materiAgg = {};
  for (var j3 = 0; j3 < k; j3++) {
    var m = itemMateri[j3] || "(materi tidak tercatat)";
    if (!materiAgg[m]) materiAgg[m] = { sumP: 0, n: 0 };
    materiAgg[m].sumP += pValues[j3];
    materiAgg[m].n += 1;
  }
  var ringkasanMateri = Object.keys(materiAgg).map(function (m) {
    var agg = materiAgg[m];
    var rataBenar = agg.sumP / agg.n;
    return { materi: m, jumlahSoal: agg.n, rataBenar: rataBenar, rataSalah: 1 - rataBenar };
  });
  ringkasanMateri.sort(function (a, b) { return b.rataSalah - a.rataSalah; });

  var barisMateri = barisReliabilitas + 4;
  out.getRange(barisMateri, 1)
    .setValue("Ringkasan Ketuntasan per Materi (soal Pilihan Ganda, diurutkan dari yang paling banyak salah)")
    .setFontWeight("bold");
  var headerMateri = ["Materi", "Jumlah Soal PG", "Rata-rata % Benar", "Rata-rata % Salah", "Catatan"];
  out.getRange(barisMateri + 1, 1, 1, headerMateri.length).setValues([headerMateri]).setFontWeight("bold").setBackground("#EAF0F6");

  for (var mi = 0; mi < ringkasanMateri.length; mi++) {
    var rm = ringkasanMateri[mi];
    var persenSalah = Math.round(rm.rataSalah * 1000) / 10; // 1 desimal
    var persenBenar = Math.round(rm.rataBenar * 1000) / 10;
    var catatan;
    if (rm.rataSalah >= 0.5) catatan = "⚠️ Perlu remedial — lebih dari separuh jawaban salah";
    else if (rm.rataSalah >= 0.3) catatan = "Perlu diperhatikan";
    else catatan = "Sudah cukup baik";
    var baris = barisMateri + 2 + mi;
    out.getRange(baris, 1, 1, headerMateri.length).setValues([[rm.materi, rm.jumlahSoal, persenBenar + "%", persenSalah + "%", catatan]]);
    if (rm.rataSalah >= 0.5) {
      out.getRange(baris, 1, 1, headerMateri.length).setBackground("#FBE0DE");
    } else if (rm.rataSalah >= 0.3) {
      out.getRange(baris, 1, 1, headerMateri.length).setBackground("#FDF3D8");
    }
  }

  // ==== RINGKASAN KETUNTASAN PER SUBMATERI (jika soal punya submateri) ====
  var submateriAgg = {};
  for (var j4 = 0; j4 < k; j4++) {
    var sm = itemSubmateri[j4];
    if (!sm) continue; // lewati soal yang tidak diberi submateri
    if (!submateriAgg[sm]) submateriAgg[sm] = { sumP: 0, n: 0, materi: itemMateri[j4] };
    submateriAgg[sm].sumP += pValues[j4];
    submateriAgg[sm].n += 1;
  }

  });

function korelasiPearson_(x, y) {
  var n = x.length;
  if (n === 0) return NaN;
  var mx = x.reduce(function (a, b) { return a + b; }, 0) / n;
  var my = y.reduce(function (a, b) { return a + b; }, 0) / n;
  var num = 0, dx2 = 0, dy2 = 0;
  for (var i = 0; i < n; i++) {
    var dx = x[i] - mx, dy = y[i] - my;
    num += dx * dy;
    dx2 += dx * dx;
    dy2 += dy * dy;
  }
  if (dx2 === 0 || dy2 === 0) return NaN;
  return num / Math.sqrt(dx2 * dy2);
}

function variansiPopulasi_(arr) {
  var n = arr.length;
  var mean = arr.reduce(function (a, b) { return a + b; }, 0) / n;
  return arr.reduce(function (a, b) { return a + Math.pow(b - mean, 2); }, 0) / n;
}

function kategoriKesukaran_(p) {
  if (p < 0.3) return "Sukar";
  if (p <= 0.7) return "Sedang";
  return "Mudah";
}

function kategoriReliabilitas_(r) {
  if (isNaN(r)) return "-";
  if (r >= 0.9) return "Sangat Tinggi";
  if (r >= 0.7) return "Tinggi";
  if (r >= 0.4) return "Cukup";
  if (r >= 0.2) return "Rendah";
  return "Sangat Rendah";
}`;

  function slugify(str) {
    return String(str || 'evaluasi-fisika')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '') || 'evaluasi-fisika';

  function parseMathJs(str) {
    str = String(str || '');
    var i = 0;
    var n = str.length;
    function readGroup() {
      i++;
      var depth = 1;
      var start = i;
      while (i < n && depth > 0) {
        if (str[i] === '(') depth++;
        else if (str[i] === ')') { depth--; if (depth === 0) break; }
        i++;
      }
      var inner = str.slice(start, i);
      i++;
      return inner;
    }
    function readSimpleToken() {
      var start = i;
      if (i < n && (str[i] === '+' || str[i] === '-')) i++;
      while (i < n && /[a-zA-Z0-9.]/.test(str[i])) i++;
      if (i === start) i++;
      return str.slice(start, i);
    }
    function splitTopLevelComma(s) {
      var depth = 0, start = 0; var parts = [];
      for (var k = 0; k < s.length; k++) {
        if (s[k] === '(') depth++;
        else if (s[k] === ')') depth--;
        else if (s[k] === ',' && depth === 0) {
          parts.push(s.slice(start, k));
          start = k + 1;
        }
      }
      parts.push(s.slice(start));
      return parts;
    }
    var nodes = [];
    var buffer = '';
    function flush() { if (buffer) { nodes.push({ t: 'text', text: buffer }); buffer = ''; } }
    while (i < n) {
      if (str[i] === '^') {
        flush();
        i++;
        var innerSup = str[i] === '(' ? readGroup() : readSimpleToken();
        nodes.push({ t: 'sup', children: parseMathJs(innerSup) });
        continue;
      }
      if (str[i] === '_') {
        flush();
        i++;
        var innerSub = str[i] === '(' ? readGroup() : readSimpleToken();
        nodes.push({ t: 'sub', children: parseMathJs(innerSub) });
        continue;
      }
      if (str.slice(i, i + 5) === 'sqrt(') {
        flush();
        i += 4;
        var innerSqrt = readGroup();
        nodes.push({ t: 'sqrt', children: parseMathJs(innerSqrt) });
        continue;
      }
      if (str.slice(i, i + 5) === 'frac(') {
        flush();
        i += 4;
        var innerFrac = readGroup();
        var parts = splitTopLevelComma(innerFrac);
        nodes.push({ t: 'frac', num: parseMathJs(parts[0] || ''), den: parseMathJs(parts[1] || '') });
        continue;
      }
      buffer += str[i];
      i++;
    }
    flush();
    return nodes;
  }

  function renderMathNodes(nodes, container) {
    nodes.forEach(function (node) {
      if (node.t === 'text') {
        container.appendChild(document.createTextNode(node.text));
      } else if (node.t === 'sup') {
        var sup = document.createElement('sup');
        sup.style.fontSize = '0.75em';
        renderMathNodes(node.children, sup);
        container.appendChild(sup);
      } else if (node.t === 'sub') {
        var sub = document.createElement('sub');
        sub.style.fontSize = '0.75em';
        renderMathNodes(node.children, sub);
        container.appendChild(sub);
      } else if (node.t === 'sqrt') {
        var wrap = document.createElement('span');
        wrap.style.display = 'inline-flex';
        wrap.style.alignItems = 'flex-start';
        var rad = document.createElement('span');
        rad.style.fontSize = '1.1em';

        var inner = document.createElement('span');
        inner.style.borderTop = '1.5px solid currentColor';
        inner.style.paddingLeft = '2px';
        inner.style.paddingTop = '1px';
        renderMathNodes(node.children, inner);
        wrap.appendChild(rad);
        wrap.appendChild(inner);
        container.appendChild(wrap);
      } else if (node.t === 'frac') {
        var fwrap = document.createElement('span');
        fwrap.style.display = 'inline-flex';
        fwrap.style.flexDirection = 'column';
        fwrap.style.alignItems = 'center';
        fwrap.style.verticalAlign = 'middle';

        renderMathNodes(node.den, denEl);
        fwrap.appendChild(numEl);
        fwrap.appendChild(line);
        fwrap.appendChild(denEl);
        container.appendChild(fwrap);
      }
    });
  }

  function splitLatex(str) {
    str = String(str || '');
    var BS = String.fromCharCode(92);
    var n = str.length, segs = [], buf = '', i = 0;
    function push() { if (buf) { segs.push({ math: false, text: buf }); buf = ''; } }
    while (i < n) {
      if (str.substr(i, 2) === '$$') {
        var e1 = str.indexOf('$$', i + 2);
        if (e1 > -1) { push(); segs.push({ math: true, display: true, text: str.slice(i + 2, e1) }); i = e1 + 2; continue; }
      }
      if (str.charAt(i) === BS && str.charAt(i + 1) === '$') { buf += '$'; i += 2; continue; }
      if (str.charAt(i) === '$') {
        var e2 = i + 1;
        while (e2 < n && !(str.charAt(e2) === '$' && str.charAt(e2 - 1) !== BS)) e2++;
        if (e2 < n && e2 > i + 1) { push(); segs.push({ math: true, display: false, text: str.slice(i + 1, e2) }); i = e2 + 1; continue; }
      }
      if (str.substr(i, 2) === BS + '(') {
        var e3 = str.indexOf(BS + ')', i + 2);
        if (e3 > -1) { push(); segs.push({ math: true, display: false, text: str.slice(i + 2, e3) }); i = e3 + 2; continue; }
      }
      if (str.substr(i, 2) === BS + '[') {
        var e4 = str.indexOf(BS + ']', i + 2);
        if (e4 > -1) { push(); segs.push({ math: true, display: true, text: str.slice(i + 2, e4) }); i = e4 + 2; continue; }
      }
      buf += str.charAt(i);
      i++;
    }
    push();
    return segs;
  }

  function renderMathInto(el, str) {
    el.innerHTML = '';
    splitLatex(str).forEach(function (sg) {
      if (!sg.math) { renderMathNodes(parseMathJs(sg.text), el); return; }
      var box = document.createElement(sg.display ? 'div' : 'span');
      var ok = false;
      if (window.katex) {
        try {
          box.innerHTML = window.katex.renderToString(sg.text, { displayMode: !!sg.display, throwOnError: false, strict: 'ignore' });
          ok = true;
        } catch (err) { ok = false; }
      }
      if (!ok) { var d = sg.display ? '$$' : '$'; box.textContent = d + sg.text + d; }
      el.appendChild(box);
    });
  }

  function kocokArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function acakOpsiSoal(soal) {
    if (soal.tipe !== 'pg' || !soal.opsi || soal.opsi.length === 0) return soal;
    var opsiAcak = kocokArray(soal.opsi);
    var hurufBaru = ['A', 'B', 'C', 'D', 'E'];
    var indeksKunciBaru = -1;
    for (var i = 0; i < opsiAcak.length; i++) {
      if (opsiAcak[i].huruf === soal.kunci) { indeksKunciBaru = i; break; }
    }
    var opsiBaru = opsiAcak.map(function (o, i) { return { huruf: hurufBaru[i], teks: o.teks }; });
    return {
      id: soal.id,
      tipe: soal.tipe,
      teks: soal.teks,
      gambar: soal.gambar || null,
      materi: soal.materi || '',
      submateri: soal.submateri || '',
      opsi: opsiBaru,
      kunci: indeksKunciBaru >= 0 ? hurufBaru[indeksKunciBaru] : soal.kunci
    };
  }

  function distribusiMerataJS(kandidat, n, submateriKeys) {
    if (n <= 0 || submateriKeys.length === 0) return [];
    var grouped = {};
    submateriKeys.forEach(function (sm) {
      grouped[sm] = kocokArray(kandidat.filter(function (c) { return c.submateri === sm; }));
    });
    var k = submateriKeys.length;
    var base = Math.floor(n / k);
    var remainder = n % k;
    var urutan = kocokArray(submateriKeys.slice());
    var jatah = {};
    urutan.forEach(function (sm, idx) {
      jatah[sm] = base + (idx < remainder ? 1 : 0);
    });
    var hasil = [];
    var kekurangan = 0;
    var sisaPool = [];
    urutan.forEach(function (sm) {
      var avail = grouped[sm] || [];
      var want = jatah[sm];
      var ambil = avail.slice(0, want);
      hasil = hasil.concat(ambil);
      if (ambil.length < want) kekurangan += (want - ambil.length);
      sisaPool = sisaPool.concat(avail.slice(want));
    });
    if (kekurangan > 0 && sisaPool.length > 0) {
      hasil = hasil.concat(kocokArray(sisaPool).slice(0, kekurangan));
    }
    return hasil;
  }

  function pilihSoalJenis(jenisKey) {
    var terpilih = [];
    ['mudah', 'sedang', 'sukar'].forEach(function (tk) {
      var n = (TARGET[jenisKey] && TARGET[jenisKey][tk]) || 0;
      var kandidatTingkat = (POOL[jenisKey] && POOL[jenisKey][tk]) || [];
      if (SUBMATERI_AKTIF.length > 0) {
        terpilih = terpilih.concat(distribusiMerataJS(kandidatTingkat, n, SUBMATERI_AKTIF));
      } else {
        terpilih = terpilih.concat(kocokArray(kandidatTingkat).slice(0, n));
      }
    });
    return terpilih;
  }

  function susunSoalUntukSiswa() {
    if (MODE_SOAL === 'sama') {
      // Soal, urutan soal, dan urutan opsi A-E dikunci sama persis untuk semua
      // siswa (tidak ada pengacakan sama sekali) — sudah disiapkan saat guru
      // mengunduh file ini.
      SECTION_BREAK = SECTION_BREAK_TETAP;
      return SOAL_TETAP;
    }
    var pgArr = pilihSoalJenis('pg');
    var esaiArr = pilihSoalJenis('esai');
    var terpilih;
    if (KELOMPOKKAN_JENIS) {
      pgArr = kocokArray(pgArr);
      esaiArr = kocokArray(esaiArr);
      terpilih = pgArr.concat(esaiArr);
      SECTION_BREAK = (pgArr.length > 0 && esaiArr.length > 0) ? pgArr.length : -1;
    } else {
      terpilih = kocokArray(pgArr.concat(esaiArr));
      SECTION_BREAK = -1;
    }
    return terpilih.map(acakOpsiSoal);
  }

  function buildJawabanArea(idx) {
    var q = QUESTIONS[idx];
    var area = document.getElementById('jawabanArea');
    area.innerHTML = '';
    if (q.tipe === 'pg' && q.opsi && q.opsi.length > 0) {

        radio.type = 'radio';
        radio.name = 'opsi-' + idx;
        radio.value = o.huruf;
        radio.checked = answers[idx] === o.huruf;
        radio.addEventListener('change', function (huruf) {
          return function () {
            answers[idx] = huruf;
            buildJawabanArea(idx);
            refreshNavButton(idx);
            refreshRingkasan();
            simpanProgress();
          };
        }(o.huruf));
        var huruf = document.createElement('span');
        huruf.className = 'opsi-huruf';
        huruf.textContent = o.huruf + '.';
        var teksSpan = document.createElement('span');
        renderMathInto(teksSpan, o.teks);
        item.appendChild(radio);
        item.appendChild(huruf);

  function saveCurrentAnswer() {

  function hitungSkor() {
    var benar = 0;
    var totalPg = 0;
    for (var i = 0; i < TOTAL_SOAL; i++) {
      var q = QUESTIONS[i];
      if (q.tipe === 'pg' && q.kunci) {
        totalPg++;
        if (answers[i] === q.kunci) benar++;
      }
    }
    var skor = totalPg > 0 ? Math.round((benar / totalPg) * 100) : null;
    return { benar: benar, totalPg: totalPg, skor: skor };
  }

  function goTo(idx) {
    if (idx < 0 || idx >= TOTAL_SOAL) return;
    saveCurrentAnswer();
    currentIndex = idx;
    renderQuestion(currentIndex);
    simpanProgress();

    else raguSet[currentIndex] = true;

  function formatWaktu(totalDetik) {
    var m = Math.floor(totalDetik / 60);
    var s = totalDetik % 60;

    window.setTimeout(function () {
